name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Build BEFORE typecheck. `tsconfig.json` includes `.next/types/**/*.ts`, which
      # `next build` generates from the current routes. Typechecking first reads whatever
      # `.next` happens to hold — nothing on a clean checkout (so the route types are never
      # checked at all) or stale types from before a route change on a warm one.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck
